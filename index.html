<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySite</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Full laptop-width header */
        .header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 60px;
            background-color: #ffffff;
            border-bottom: 1px solid #ddd;
        }

        /* Website name */
        .site-name {
            font-size: 30px;
            font-weight: bold;
            margin-right: 120px;
        }

        /* Navigation */
        .navbar {
            flex: 1;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .nav-container a {
            text-decoration: none;
            color: #222;
            font-size: 18px;
            padding: 15px 40px;
        }

        .nav-container a:hover {
            color: #007bff;
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="site-name">
            MySite
        </div>

        <nav class="navbar">
            <div class="nav-container">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </nav>

    </header>

</body>
</html>
