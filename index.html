<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;

            grid-template-columns: 1fr 2fr 2fr;
            grid-template-rows: 80px 100px 100px 80px;

            gap: 10px;

            padding: 10px;
        }

        .header {
            grid-column: 1 / 4;
        }

        .sidebar {
            grid-column: 1;
            grid-row: 2 / 4;
        }

        .content1 {
            grid-column: 2 / 4;
            grid-row: 2;
        }

        .content2 {
            grid-column: 2;
            grid-row: 3;
        }

        .content3 {
            grid-column: 3;
            grid-row: 3;
        }

        .footer {
            grid-column: 1 / 4;
            grid-row: 4;
        }

        .container > div {
            border: 1px solid;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">Header</div>

        <div class="sidebar">Side Bar</div>

        <div class="content1">Content 1</div>

        <div class="content2">Content 2</div>

        <div class="content3">Content 3</div>

        <div class="footer">Footer</div>

    </div>

</body>
</html>
