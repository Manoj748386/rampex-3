<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySite</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Website name */
        .site-name {
            font-size: 28px;
            font-weight: bold;
            padding: 20px;
        }

        /* Navbar */
        .navbar {
            width: 250px;
            margin-left: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-container a {
            text-decoration: none;
            color: black;
            font-size: 18px;
            padding: 10px;
        }

        .nav-container a:hover {
            background-color: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="site-name">
        MySite
    </div>

    <div class="navbar">
        <div class="nav-container">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </div>

</body>
</html>
