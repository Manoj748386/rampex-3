<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySite</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid #ccc;
        }

        /* Website name */
        .site-name {
            font-size: 28px;
            font-weight: bold;
            margin-right: 50px;
        }

        /* Navbar */
        .navbar {
            padding: 10px 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }

        .nav-container {
            display: flex;
            gap: 50px;
        }

        .nav-container a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        .nav-container a:hover {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="site-name">
            MySite
        </div>

        <div class="navbar">
            <div class="nav-container">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </div>

    </div>

</body>
</html>
