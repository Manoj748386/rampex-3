<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MySite</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: white;
        }

        /* =========================
           FULL PAGE BACKGROUND
        ========================= */

        .hero {
            min-height: 100vh;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1920&q=80");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            padding-top: 1px;
        }


        /* =========================
           NAVBAR
        ========================= */

        .header {
            width: 92%;
            height: 78px;

            margin: 20px auto;

            display: flex;
            align-items: center;

            padding: 0 30px;

            background: rgba(15, 23, 42, 0.75);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.3),
                inset 0 1px rgba(255, 255, 255, 0.1);
        }


        /* =========================
           LOGO
        ========================= */

        .site-name {
            font-size: 30px;

            font-weight: 800;

            letter-spacing: 1px;

            color: white;

            margin-right: 80px;

            cursor: pointer;

            transition: 0.3s;
        }

        .site-name span {
            color: #00e5ff;
        }

        .site-name:hover {
            transform: scale(1.05);

            text-shadow:
                0 0 10px #00e5ff,
                0 0 25px #00e5ff;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            display: flex;

            align-items: center;

            gap: 10px;

            flex: 1;
        }

        .navbar a {
            position: relative;

            text-decoration: none;

            color: #dbeafe;

            font-size: 16px;

            font-weight: 600;

            padding: 12px 20px;

            border-radius: 10px;

            transition: all 0.3s ease;
        }


        /* Hover */

        .navbar a:hover {
            color: white;

            background: rgba(0, 229, 255, 0.12);

            transform: translateY(-2px);

            box-shadow:
                0 5px 15px rgba(0, 229, 255, 0.15);
        }


        /* Underline */

        .navbar a::after {
            content: "";

            position: absolute;

            width: 0;

            height: 3px;

            left: 50%;

            bottom: 5px;

            background: #00e5ff;

            border-radius: 10px;

            transform: translateX(-50%);

            transition: width 0.3s ease;
        }

        .navbar a:hover::after {
            width: 55%;
        }


        /* Active link */

        .navbar a.active {
            color: #00e5ff;

            background: rgba(0, 229, 255, 0.10);
        }

        .navbar a.active::after {
            width: 55%;
        }


        /* =========================
           GET STARTED BUTTON
        ========================= */

        .nav-button {
            text-decoration: none;

            color: #06121a;

            background: linear-gradient(
                135deg,
                #00e5ff,
                #00a8ff
            );

            padding: 12px 22px;

            border-radius: 25px;

            font-weight: bold;

            transition: all 0.3s ease;

            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.25);
        }

        .nav-button:hover {
            transform: translateY(-2px) scale(1.04);

            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.55);
        }


        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {
            min-height: calc(100vh - 120px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 20px;
        }


        .hero-content h1 {
            font-size: 65px;

            margin-bottom: 20px;

            text-shadow:
                0 5px 20px rgba(0, 0, 0, 0.6);
        }


        .hero-content h1 span {
            color: #00e5ff;
        }


        .hero-content p {
            max-width: 650px;

            font-size: 20px;

            line-height: 1.6;

            color: #e5e7eb;

            margin-bottom: 35px;
        }


        /* =========================
           HERO BUTTON
        ========================= */

        .hero-button {
            text-decoration: none;

            color: white;

            background: linear-gradient(
                135deg,
                #00a8ff,
                #00e5ff
            );

            padding: 15px 35px;

            border-radius: 30px;

            font-size: 18px;

            font-weight: bold;

            transition: all 0.3s ease;

            box-shadow:
                0 0 20px rgba(0, 229, 255, 0.3);
        }

        .hero-button:hover {
            transform: scale(1.08);

            box-shadow:
                0 0 35px rgba(0, 229, 255, 0.7);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .header {
                width: 95%;
                padding: 0 15px;
            }

            .site-name {
                margin-right: 20px;
                font-size: 24px;
            }

            .navbar {
                gap: 2px;
            }

            .navbar a {
                padding: 10px;
                font-size: 14px;
            }

            .nav-button {
                display: none;
            }

            .hero-content h1 {
                font-size: 42px;
            }

            .hero-content p {
                font-size: 17px;
            }
        }

    </style>

</head>


<body>


    <div class="hero">


        <!-- =========================
             NAVBAR
        ========================= -->

        <header class="header">

            <div class="site-name">
                My<span>Site</span>
            </div>


            <nav class="navbar">

                <a href="#" class="active">
                    Home
                </a>

                <a href="#">
                    About
                </a>

                <a href="#">
                    Services
                </a>

                <a href="#">
                    Contact
                </a>

            </nav>


            <a href="#" class="nav-button">
                Get Started
            </a>

        </header>



        <!-- =========================
             HERO SECTION
        ========================= -->

        <section class="hero-content">

            <h1>
                Welcome to <span>MySite</span>
            </h1>

            <p>
                Discover a modern and beautiful web experience.
                Explore our services and learn more about what
                we can do for you.
            </p>

            <a href="#" class="hero-button">
                Explore Now
            </a>

        </section>


    </div>


</body>

</html>
